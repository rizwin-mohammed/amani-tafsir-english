name: Check and publish the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checks on pull requests can only read the code. Only the deploy job, which runs for main alone,
# may publish to GitHub Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Accuracy checks
        run: npm run check
      - name: Build the site
        run: npm run build
      - name: Add the check report to the run summary
        if: always()
        run: cat check-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
